[[locations]]
id = "kitchen"
name = "Kitchen"
description = "A cramped kitchen with too many drawers, not enough comfort, and the best chance in the house of finding something useful."
epilogue_description = "The kitchen looks smaller after the noise dies down. The drawers are still a mess, but now it feels like aftermath instead of panic."
epilogue_hook = "Post-credits hook: the fridge magnet calendar has one circled date that was not relevant to this run."
narrator_brief = "Keep the kitchen tense and domestic at the same time, like a room that still thinks normal life might come back if nobody looks too closely."
