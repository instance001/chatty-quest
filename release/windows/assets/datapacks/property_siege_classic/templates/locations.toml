[[locations]]
id = "laundry"
name = "Laundry"
description = "A narrow little choke point full of plastic baskets, bad tension, and one small reminder that this used to be a home."
epilogue_description = "The laundry is quiet enough to hear the drip again. It is not comforting, exactly, but it is ordinary, and ordinary suddenly has teeth."
epilogue_hook = "Post-credits hook: the washing machine coughs once after the house goes quiet, leaving room for a future clue or cheap scare."
narrator_brief = "Make this room feel cramped, damp, and faintly ridiculous, like a place where panic has to squeeze sideways to fit."
tags = ["indoor", "utility", "flavor_loot"]
connections = ["kitchen"]
items = ["house_keys"]
